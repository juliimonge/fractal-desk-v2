[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fractal-desk-v2"
version = "1.0.0"
description = "Deadline engine and dashboard for received Costa Rican electronic documents (TRIBU-CR). Synthetic data only."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
